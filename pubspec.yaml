name: beamo
description: Local-network file sharing — phone to TV, phone to phone. No internet needed.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Local network
  nsd: ^5.0.1
  network_info_plus: ^8.2.2
  # Embedded HTTP server (receiver side)
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http: ^1.2.0
  # Files
  file_picker: ^13.1.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  # run: dart run flutter_launcher_icons
